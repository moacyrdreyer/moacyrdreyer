<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="Gmail"><title>Gmail</title>
<defs><style>
.lbl{font-family:'BodyM',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;fill:#8fb0ff}
.name{font-family:'Sora',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef0f2}
.txt{font-family:'Body',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a3a9b0}
.cap{font-family:'Body',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b9198}
.a1{animation:d1 9s ease-in-out infinite alternate}
.a2{animation:d2 11s ease-in-out infinite alternate}
