<radialGradient id="g2"><stop offset="0" stop-color="#2fd3c2" stop-opacity=".42"/><stop offset=".6" stop-color="#2fd3c2" stop-opacity="0"/></radialGradient></defs>
<g transform="translate(0,0)"><rect x=".5" y=".5" width="55" height="55" rx="14" fill="url(#bg)" stroke="#2f3a4f"/><rect x="1" y="1" width="54" height="54" rx="13" fill="none" stroke="#4f7cff" stroke-opacity=".18" stroke-width="2"/><g transform="translate(16.0,16.0)"><g fill="none" stroke="#c9cdd2" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.9 2.8 16.1 0 19M12 2.5c-2.8 2.9-2.8 16.1 0 19"/></g></g></g></svg>